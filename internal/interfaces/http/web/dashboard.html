<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Tracker Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --panel-strong: #fffdf8;
      --ink: #1f2933;
      --muted: #5b6b79;
      --line: rgba(56, 73, 89, 0.12);
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --positive: #0f9f6e;
      --negative: #c2410c;
      --shadow: 0 18px 50px rgba(59, 41, 18, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.16), transparent 30%),
        radial-gradient(circle at top right, rgba(180, 83, 9, 0.14), transparent 28%),
        linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    .eyebrow, .meta, .empty, .error, .loading, th, .allocation-label {
      color: var(--muted);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.74rem;
      margin: 0 0 8px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 0.96;
      max-width: 10ch;
    }

    .meta {
      font-size: 0.95rem;
      text-align: right;
      max-width: 26ch;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .summary-grid {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-bottom: 18px;
    }

    .alloc-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      margin-bottom: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card, .alloc-card, .table-card {
      padding: 20px;
    }

    .card-label, .panel-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .card-value {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .card-subvalue {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }

    .allocation-list {
      display: grid;
      gap: 12px;
    }

    .allocation-row {
      display: grid;
      gap: 6px;
    }

    .allocation-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }

    .allocation-label {
      font-weight: 600;
    }

    .allocation-value {
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }

    .allocation-bar {
      height: 8px;
      width: 100%;
      border-radius: 999px;
      background: rgba(56, 73, 89, 0.08);
      overflow: hidden;
    }

    .allocation-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0f766e 0%, #d97706 100%);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    td {
      font-size: 0.96rem;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .symbol {
      font-weight: 700;
    }

    .name {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.88rem;
    }

    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .sparkline {
      width: 110px;
      height: 38px;
      display: inline-block;
    }

    .sparkline svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .sparkline-empty {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .empty, .error, .loading {
      padding: 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px dashed var(--line);
    }

    .error {
      color: var(--negative);
      border-style: solid;
      background: rgba(194, 65, 12, 0.08);
    }

    .loading {
      padding: 18px;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1180px); padding-top: 20px; }
      .hero { align-items: flex-start; }
      .meta { text-align: left; }
      .card, .alloc-card, .table-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">Portfolio dashboard</p>
        <h1>Stock Tracker</h1>
      </div>
      <div class="meta" id="meta">Loading dashboard data…</div>
    </section>

    <section class="grid summary-grid" id="summary"></section>
    <section class="grid alloc-grid" id="allocations"></section>
    <section class="panel table-card">
      <p class="panel-title">Positions</p>
      <div id="positions"></div>
    </section>
  </main>

  <script>
    // Bug 2 fix: use 7d sparklines by default to avoid large payload without server-side downsampling.
    // 30d sparklines can still be requested by changing this value if needed.
    const dashboardURL = "/api/v1/dashboard?sparklines=7";

    // Escape < > & " for safe insertion into textContent and attribute context.
    const esc = s => String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    // Parse a decimal string to a number, safely returning null on failure.
    // Keeps values as strings for display to preserve precision;
    // only converts to Number where numeric comparison is unavoidable.
    const toNum = value => {
      const n = Number(value);
      return Number.isNaN(n) ? null : n;
    };

    // Format a numeric value as decimal string, or return raw value on failure.
    // Uses backend-provided strings directly to avoid floating-point rounding.
    const fmt = value => {
      const n = toNum(value);
      if (n === null) return String(value);
      return new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(n);
    };

    // Format a numeric value with currency.
    const fmtMoney = (value, currency) => {
      const n = toNum(value);
      if (n === null) return String(value);
      if (!currency) return fmt(value);
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency,
          maximumFractionDigits: 2
        }).format(n);
      } catch {
        return `${fmt(value)} ${esc(currency)}`;
      }
    };

    // Format as percentage string from a backend-provided percent value.
    const fmtPct = value => {
      const n = toNum(value);
      if (n === null) return String(value);
      return `${n.toFixed(2)}%`;
    };

    const pnlClass = value => {
      const n = toNum(value);
      return n !== null && n >= 0 ? "positive" : "negative";
    };

    const pickSparkline = position => {
      if (!position.sparklines) return [];
      // Prefer the shortest available range to minimise payload; upgrade if needed.
      for (const key of ["7d", "30d", "90d"]) {
        const pts = position.sparklines[key];
        if (Array.isArray(pts) && pts.length > 0) return pts;
      }
      return [];
    };

    const renderSparkline = points => {
      if (!points.length) return '<span class="sparkline-empty">No trend</span>';

      const values = points.map(p => toNum(p.price)).filter(n => n !== null);
      if (!values.length) return '<span class="sparkline-empty">No trend</span>';

      const width = 110;
      const height = 38;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const step = values.length > 1 ? width / (values.length - 1) : width;
      const coords = values.map((v, i) => {
        const x = (i * step).toFixed(2);
        const y = (height - ((v - min) / range) * (height - 4) - 2).toFixed(2);
        return `${x},${y}`;
      }).join(" ");

      const label = `Price trend (${points.length} points)`;
      return `<span class="sparkline" aria-label="${esc(label)}">` +
        `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}">` +
        `<polyline fill="none" stroke="rgba(15,118,110,0.18)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" points="${coords}"></polyline>` +
        `<polyline fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${coords}"></polyline>` +
        `</svg></span>`;
    };

    // Build a summary card using DOM APIs so no HTML interpolation touches untrusted values.
    const card = (label, value, subvalue, cls = "") => {
      const article = document.createElement("article");
      article.className = "panel card";
      const labelEl = document.createElement("p");
      labelEl.className = "card-label";
      labelEl.textContent = label;
      const valueEl = document.createElement("p");
      valueEl.className = `card-value ${esc(cls)}`;
      valueEl.textContent = value;
      const subEl = document.createElement("div");
      subEl.className = "card-subvalue";
      subEl.textContent = subvalue;
      article.appendChild(labelEl);
      article.appendChild(valueEl);
      article.appendChild(subEl);
      return article;
    };

    const renderAllocations = (title, items, key) => {
      const article = document.createElement("article");
      article.className = "panel alloc-card";
      const titleEl = document.createElement("p");
      titleEl.className = "panel-title";
      titleEl.textContent = title;
      article.appendChild(titleEl);

      const list = document.createElement("div");
      list.className = "allocation-list";

      if (items.length) {
        const sorted = items.slice().sort((a, b) => {
          const na = toNum(b.percent), nb = toNum(a.percent);
          return (na ?? 0) - (nb ?? 0);
        });
        for (const item of sorted) {
          const row = document.createElement("div");
          row.className = "allocation-row";

          const head = document.createElement("div");
          head.className = "allocation-head";

          const labelSpan = document.createElement("span");
          labelSpan.className = "allocation-label";
          labelSpan.textContent = item[key] || "N/A";

          const valueSpan = document.createElement("span");
          valueSpan.className = "allocation-value";
          const displayVal = key === "currency" ? fmtMoney(item.total_value, item.currency) : fmt(item.total_value);
          valueSpan.textContent = `${displayVal} · ${fmtPct(item.percent)}`;

          head.appendChild(labelSpan);
          head.appendChild(valueSpan);

          const bar = document.createElement("div");
          bar.className = "allocation-bar";
          const fill = document.createElement("div");
          fill.className = "allocation-fill";
          const pct = toNum(item.percent);
          fill.style.width = `${Math.min(Math.max(pct ?? 0, 0), 100)}%`;

          bar.appendChild(fill);
          row.appendChild(head);
          row.appendChild(bar);
          list.appendChild(row);
        }
      } else {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No allocation data yet.";
        list.appendChild(empty);
      }

      article.appendChild(list);
      return article;
    };

    const renderPositions = positions => {
      const container = document.createElement("div");

      if (!positions.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No positions yet. Add holdings through the API to populate the dashboard.";
        container.appendChild(empty);
        return container;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      for (const th of ["Position", "CCY", "Type", "Sector", "Qty", "Price", "Value", "Invested", "P/L", "Trend"]) {
        const thEl = document.createElement("th");
        thEl.textContent = th;
        headerRow.appendChild(thEl);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const position of positions) {
        const tr = document.createElement("tr");

        // Position cell: symbol + name, both use textContent (safe from XSS)
        const posTd = document.createElement("td");
        const symDiv = document.createElement("div");
        symDiv.className = "symbol";
        symDiv.textContent = position.symbol || position.isin || "";
        const nameDiv = document.createElement("div");
        nameDiv.className = "name";
        nameDiv.textContent = position.name || "Unnamed instrument";
        posTd.appendChild(symDiv);
        posTd.appendChild(nameDiv);
        tr.appendChild(posTd);

        // CCY
        const ccyTd = document.createElement("td");
        ccyTd.textContent = position.currency || "";
        tr.appendChild(ccyTd);

        // Type pill — safe because type is an enum string, not user-supplied HTML
        const typeTd = document.createElement("td");
        const typeSpan = document.createElement("span");
        typeSpan.className = "pill";
        typeSpan.textContent = position.type || "n/a";
        typeTd.appendChild(typeSpan);
        tr.appendChild(typeTd);

        // Sector
        const secTd = document.createElement("td");
        secTd.textContent = position.sector || "N/A";
        tr.appendChild(secTd);

        // Quantity
        const qtyTd = document.createElement("td");
        qtyTd.textContent = fmt(position.quantity);
        tr.appendChild(qtyTd);

        // Current price
        const priceTd = document.createElement("td");
        priceTd.textContent = fmtMoney(position.current_price, position.currency);
        tr.appendChild(priceTd);

        // Current value
        const valueTd = document.createElement("td");
        valueTd.textContent = fmtMoney(position.current_value, position.currency);
        tr.appendChild(valueTd);

        // Invested
        const invTd = document.createElement("td");
        invTd.textContent = fmtMoney(position.invested_amount, position.currency);
        tr.appendChild(invTd);

        // P/L
        const pnlTd = document.createElement("td");
        const pnlVal = fmtMoney(position.pnl, position.currency);
        const pnlValDiv = document.createElement("span");
        pnlValDiv.textContent = pnlVal;
        pnlValDiv.className = esc(pnlClass(position.pnl));
        const pnlPct = document.createElement("span");
        pnlPct.className = `name ${esc(pnlClass(position.pnl_percent))}`;
        pnlPct.textContent = fmtPct(position.pnl_percent);
        pnlTd.appendChild(pnlValDiv);
        pnlTd.appendChild(document.createElement("br"));
        pnlTd.appendChild(pnlPct);
        tr.appendChild(pnlTd);

        // Trend sparkline
        const trendTd = document.createElement("td");
        trendTd.innerHTML = renderSparkline(pickSparkline(position));
        tr.appendChild(trendTd);

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      wrapper.appendChild(table);
      container.appendChild(wrapper);
      return container;
    };

    const setError = message => {
      document.getElementById("meta").textContent = "Dashboard unavailable";
      const summary = document.getElementById("summary");
      summary.textContent = "";
      const errDiv = document.createElement("div");
      errDiv.className = "error";
      errDiv.textContent = message; // textContent prevents XSS
      summary.appendChild(errDiv);
      document.getElementById("allocations").textContent = "";
      document.getElementById("positions").textContent = "";
    };

    const render = data => {
      const generated = data.generated_at ? new Date(data.generated_at) : null;
      const meta = document.getElementById("meta");
      if (generated && !Number.isNaN(generated.getTime())) {
        const id = data.portfolio_id || "default";
        const dateStr = generated.toLocaleString();
        meta.textContent = `Portfolio ${id} · Updated ${dateStr}`;
      } else {
        meta.textContent = `Portfolio ${data.portfolio_id || "default"}`;
      }

      const summary = document.getElementById("summary");
      summary.textContent = "";
      summary.appendChild(card("Total value", fmt(data.total_value), "Current market value"));
      const pnlCls = pnlClass(data.total_pnl);
      summary.appendChild(card("Invested", fmt(data.total_invested), "Net capital deployed"));
      summary.appendChild(card("Profit / loss", fmt(data.total_pnl), `${fmtPct(data.pnl_percent)} overall`, pnlCls));
      summary.appendChild(card("Positions", String((data.positions || []).length), "Tracked holdings"));

      const allocations = document.getElementById("allocations");
      allocations.textContent = "";
      allocations.appendChild(renderAllocations("By currency", data.by_currency || [], "currency"));
      allocations.appendChild(renderAllocations("By type", data.by_type || [], "type"));
      allocations.appendChild(renderAllocations("By sector", data.by_sector || [], "sector"));

      const positions = document.getElementById("positions");
      positions.textContent = "";
      positions.appendChild(renderPositions(data.positions || []));
    };

    const loading = document.createElement("div");
    loading.className = "loading";
    loading.textContent = "Loading summary…";
    const loadingAlloc = document.createElement("div");
    loadingAlloc.className = "loading";
    loadingAlloc.textContent = "Loading allocations…";
    const loadingPos = document.createElement("div");
    loadingPos.className = "loading";
    loadingPos.textContent = "Loading positions…";

    document.getElementById("summary").appendChild(loading);
    document.getElementById("allocations").appendChild(loadingAlloc);
    document.getElementById("positions").appendChild(loadingPos);

    fetch(dashboardURL, { headers: { "Accept": "application/json" } })
      .then(response => {
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch(error => {
        setError(`Failed to load dashboard: ${error.message}`);
      });
  </script>
</body>
</html>
